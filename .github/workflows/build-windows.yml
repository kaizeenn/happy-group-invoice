name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows release (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify project
        run: flutter analyze

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows application
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath happy-group-invoice-windows.zip

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: happy-group-invoice-windows
          path: happy-group-invoice-windows.zip
          if-no-files-found: error
          retention-days: 30
